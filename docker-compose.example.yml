x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "hyperodactyl"
    MYSQL_ROOT_PASSWORD: "rootpassword"

  panel:
    &panel-environment
    APP_URL: "http://localhost:8080"
    APP_TIMEZONE: "Asia/Dhaka"
    APP_SERVICE_AUTHOR: "noreply@example.com"

  mail:
    &mail-environment
    MAIL_FROM: "noreply@example.com"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

services:
  database:
    image: mariadb:11
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "./docker-data/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "hyperodactyl"

  cache:
    image: redis:alpine
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - database
      - cache
    volumes:
      - "./docker-data/var:/app/var/"
      - "./docker-data/nginx:/etc/nginx/http.d/"
      - "./docker-data/certs:/etc/letsencrypt/"
      - "./docker-data/logs:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
